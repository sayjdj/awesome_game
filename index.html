<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>킹받는 게임 모음집</title>
    <!-- [Bolt Optimization]: Moved Google Fonts from @import in CSS to <link> tags in HTML -->
    <!-- 💡 Why: @import in CSS blocks the browser from downloading the font until the CSS file itself is downloaded and parsed, creating a render-blocking request chain. Using <link preconnect> and <link stylesheet> allows the browser to discover and download the font much earlier in parallel. -->
    <!-- 📊 Impact: Significantly improves First Contentful Paint (FCP) and eliminates the render-blocking request chain. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script defer src="common.js"></script>
</head>
<body class="rainbow-bg">
    <div class="container">
        <h1 class="wobbly-text">👑 킹받는 게임 아케이드 👑</h1>
        <p class="annoying-blink">진정한 분노를 경험해보세요 ^^</p>

        <div class="game-menu">
            <div class="game-card" onclick="location.href='button.html'">
                <h2>🏃 도망가는 버튼</h2>
                <p>클릭할 수 있으면 해보시지!</p>
            </div>

            <div class="game-card" onclick="location.href='snake.html'">
                <h2>🐍 청개구리 뱀 게임</h2>
                <p>조작키가 제멋대로 바뀌는 지옥의 스네이크</p>
            </div>

            <div class="game-card" onclick="location.href='word.html'">
                <h2>🤯 끝에서 앞말 잇기</h2>
                <p>단어의 끝이 아니라 중간부터 이어야 한다고?</p>
            </div>
        </div>
    </div>
</body>
</html>
