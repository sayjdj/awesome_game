<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끝에서 앞말 잇기</title>
    <!-- [Bolt Optimization]: Loaded Google Fonts via <link> instead of @import in CSS -->
    <!-- 💡 Why: @import in CSS creates a render-blocking request chain (HTML -> CSS -> Font). -->
    <!-- 📊 Impact: Parallelizes asset downloading, significantly improving First Contentful Paint (FCP). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script defer src="common.js"></script>
    <script defer src="word.js"></script>
    <style>
        .word-game-board {
            background: white;
            padding: 40px;
            border-radius: 20px;
            border: 4px solid #333;
            text-align: center;
            box-shadow: 10px 10px 0px #333;
            max-width: 600px;
            width: 90%;
        }
        .current-word {
            font-size: 3rem;
            color: #0055ff;
            margin: 20px 0;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            letter-spacing: 5px;
        }
        .target-char {
            color: red;
            font-weight: bold;
            text-decoration: underline;
        }
        .input-area {
            margin-top: 20px;
        }
        input[type="text"] {
            font-size: 1.5rem;
            padding: 10px;
            border: 3px solid #333;
            border-radius: 10px;
            width: 70%;
        }
        button.submit-btn {
            font-size: 1.5rem;
            padding: 10px 20px;
            background: #ffcc00;
            border: 3px solid #333;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #333;
        }
        button.submit-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px #333;
        }
        .history {
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            background: #fafafa;
            border: 2px dashed #ccc;
        }
        .rule-box {
            font-size: 1.2rem;
            color: #d80000;
            margin-bottom: 20px;
            animation: blink 1.5s infinite;
        }
    </style>
</head>
<body class="rainbow-bg">
    <button class="back-btn" onclick="location.href='index.html'">🔙 뒤로가기</button>

    <div class="game-container">
        <div class="word-game-board">
            <h1>🤯 끝에서 앞말 잇기</h1>
            <div class="rule-box" id="ruleText">규칙: 제시어의 <b>'앞에서 두 번째 글자'</b>로 시작하는 3글자 단어를 입력하세요!</div>

            <div class="current-word" id="currentWordDisplay">
                대<span class="target-char">한</span>민국
            </div>

            <div class="input-area">
                <input type="text" id="wordInput" placeholder="예: 한라산" maxlength="3">
                <button class="submit-btn" onclick="submitWord()">입력</button>
            </div>
            <p id="feedback" style="color:red; font-weight:bold; height: 24px; margin-top:10px;"></p>

            <div class="history" id="wordHistory">
                <strong>히스토리:</strong><br>
                대한민국
            </div>
        </div>
    </div>
</body>
</html>
